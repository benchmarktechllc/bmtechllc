name: Article aggregator CI

on:
  pull_request:
    paths:
      - "projects/internal-tools/article-aggregator/**"
      - ".github/workflows/article-aggregator.yml"
      - ".github/workflows/article-aggregator-digest.yml"
  push:
    branches: [main]
    paths:
      - "projects/internal-tools/article-aggregator/**"
      - ".github/workflows/article-aggregator.yml"
      - ".github/workflows/article-aggregator-digest.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/internal-tools/article-aggregator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/internal-tools/article-aggregator/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: mypy src
