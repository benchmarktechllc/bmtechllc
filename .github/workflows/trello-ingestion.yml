name: Trello ingestion

on:
  schedule:
    # Schedules use UTC. Offset from discord-ingestion (03:17) and portal-ingestion (04:17).
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trello-ingestion
  cancel-in-progress: false

defaults:
  run:
    working-directory: projects/internal-tools/benchmark-cli-tool

jobs:
  sync:
    runs-on: ubuntu-latest
    # Same environment as Discord sync so the prod corpus credentials stay in
    # one place. Add TRELLO_API_KEY and TRELLO_TOKEN secrets there. TRELLO_BOARD_ID
    # is an optional variable; an empty value keeps the BMTech General Board
    # short link tIvVZqio.
    environment: discord-ingestion
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install .
      - run: benchmark-sync-trello
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ vars.TRELLO_BOARD_ID }}
