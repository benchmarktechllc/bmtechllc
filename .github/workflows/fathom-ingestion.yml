name: Fathom ingestion

on:
  schedule:
    # Schedules use UTC. Offset from discord-ingestion (03:17), portal-ingestion
    # (04:17), and trello-ingestion (04:47).
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fathom-ingestion
  cancel-in-progress: false

defaults:
  run:
    working-directory: projects/internal-tools/benchmark-cli-tool

jobs:
  sync:
    runs-on: ubuntu-latest
    # Same environment as Discord sync so the prod corpus credentials stay in
    # one place. Add the FATHOM_API_KEY secret there. DATABASE_URL and
    # OPENAI_API_KEY are already stored on this environment.
    environment: discord-ingestion
    # Transcript calls are rate limited. A large first backfill can outlast the
    # other sync jobs; already indexed meetings are skipped if this is re-run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install .
      - run: benchmark-sync-fathom
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FATHOM_API_KEY: ${{ secrets.FATHOM_API_KEY }}
