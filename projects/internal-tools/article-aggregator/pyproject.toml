[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "article-aggregator"
version = "0.1.0"
description = "Keyword-filtered RSS digest posted daily to Discord"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "pydantic>=2.0,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.scripts]
article-aggregator = "article_aggregator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/article_aggregator"]
