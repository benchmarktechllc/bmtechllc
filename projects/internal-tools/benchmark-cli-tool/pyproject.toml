[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "benchmark-cli-tool"
version = "0.1.9"
description = "Document ingestion, hybrid retrieval, and retrieval evaluation"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2.5",
  "tiktoken>=0.7.0",
  "discord.py>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
benchmark-ingest = "benchmark_cli.ingestion.pipeline:main"
benchmark-evaluate = "benchmark_cli.evaluation.cli:main"
benchmark-search = "benchmark_cli.search_cli:main"
benchmark-answer = "benchmark_cli.agent:main"
benchmark-sync-discord = "benchmark_cli.discord_sync:main"
benchmark-sync-portal = "benchmark_cli.portal_sync:main"
benchmark-sync-trello = "benchmark_cli.trello_sync:main"
benchmark-sync-fathom = "benchmark_cli.fathom_sync:main"
benchmark-sync-fireflies = "benchmark_cli.fireflies_sync:main"
benchmark-discord-ask = "benchmark_cli.discord_ask:main"
benchmark-remove-contribution = "benchmark_cli.contributions:main"
benchmark-acceptance = "benchmark_cli.acceptance:main"

[tool.pytest.ini_options]
addopts = "-m 'not integration_live'"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "unit: deterministic isolated tests",
  "integration: tests requiring a local PostgreSQL service",
  "integration_live: real pgvector and OpenAI-embedding integration tests",
  "eval: retrieval evaluation tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_cli"]
